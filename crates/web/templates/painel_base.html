<style>
@font-face{font-family:"Archivo";font-weight:100 900;font-display:swap;src:url(/recursos/fontes/archivo.woff2) format("woff2")}
:root{--papel:#f6f5f2;--superficie:#fff;--grafite:#1c1917;--suave:#57534e;--borda:#dedbd3;--borda-campo:#8c877d;--cota:#1a4fa0;--cota-forte:#143d7c;--sobre-cota:#fff;--terracota:#9a3412;--erro:#8a1c12;--erro-fundo:#fde8e6;--sucesso:#17502a;--sucesso-fundo:#e5f3e8;--atencao-fundo:#fff7e0;--afundada:#f5f5f4;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--papel:#141210;--superficie:#24211e;--grafite:#f5f5f4;--suave:#a8a29e;--borda:#3a3632;--borda-campo:#857d76;--cota:#8fb4f0;--cota-forte:#b5cdf5;--sobre-cota:#0f1b2e;--terracota:#fb923c;--erro:#fca5a5;--erro-fundo:#3a1512;--sucesso:#86efac;--sucesso-fundo:#0f2a19;--atencao-fundo:#33280a;--afundada:#2a2622}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 "Archivo",system-ui,sans-serif;color:var(--grafite);background:var(--papel)}
.barra{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 1rem;background:var(--superficie);box-shadow:0 1px 0 var(--borda)}
a{color:var(--cota)}
.barra a{display:block;line-height:0}
.assinatura{display:block;height:28px;width:auto}
.assinatura .m{fill:var(--terracota)}.assinatura .t{fill:var(--grafite)}.assinatura .a{fill:var(--suave)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--cota);outline-offset:2px}
main{max-width:32rem;margin:0 auto;padding:1rem}
h1{font-size:1.5rem;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:0}
h2{font-size:1.125rem;font-weight:700;margin:1.25rem 0 .5rem}
p{margin:.25rem 0}
.quem{color:var(--suave);font-size:.875rem}
.recado{padding:.6rem .75rem;border-radius:.5rem;margin:.75rem 0;font-size:.9375rem}
.erro{background:var(--erro-fundo);color:var(--erro)}
.aviso{background:var(--sucesso-fundo);color:var(--sucesso)}
ul{list-style:none;margin:0;padding:0}
li{background:var(--superficie);border:1px solid var(--borda);border-radius:.5rem;padding:.6rem .75rem;margin-bottom:.5rem}
li strong{display:block}
li a{color:var(--cota);overflow-wrap:anywhere}
.etiquetas{color:var(--suave);font-size:.8125rem}
form{background:var(--superficie);border:1px solid var(--borda);border-radius:.5rem;padding:.75rem}
label{display:block;font-size:.875rem;margin-top:.5rem}
label:first-child{margin-top:0}
input{width:100%;min-height:44px;font:inherit;color:inherit;background:var(--superficie);padding:.55rem .6rem;border:1px solid var(--borda-campo);border-radius:.4rem}
.dica{color:var(--suave);font-size:.8125rem}
select{width:100%;min-height:44px;font:inherit;color:inherit;padding:.55rem .6rem;border:1px solid var(--borda-campo);border-radius:.4rem;background:var(--superficie)}
.voltar{display:inline-block;margin-bottom:.5rem;color:var(--cota);font-size:.875rem}
.acao{float:right;font-size:.875rem;margin-left:.75rem}
.midia{display:flex;gap:.6rem;align-items:flex-start}
.midia img{border-radius:.3rem;object-fit:cover;background:var(--afundada)}
.midia code{display:block;word-break:break-all}
.site{display:flex;gap:.75rem;align-items:flex-start}
.logo-atual{display:block;margin:.25rem 0 .4rem;border-radius:.3rem;object-fit:contain;background:var(--afundada)}
.ordem{display:flex;gap:.6rem;align-items:center;margin-top:.4rem}
.ordem input[type=number]{width:4.5rem;flex-shrink:0}
.site img{display:block;width:96px;height:64px;border-radius:.3rem;object-fit:cover;background:var(--afundada)}
.site>div{flex:1;min-width:0}
.busca div{display:flex;gap:.5rem}
.busca input{flex:1;min-width:0}
.busca button{width:auto;margin:0;white-space:nowrap}
.paginas{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:1rem 0;font-size:.875rem;color:var(--suave)}
form.discreto{border:0;padding:0;background:none}
form.discreto button{width:auto;margin-top:.3rem;padding:.25rem .6rem;font-weight:400;font-size:.8125rem;background:var(--superficie);color:var(--erro);border:1px solid var(--erro)}
input[type=file]{padding:.4rem}
textarea{width:100%;font:inherit;color:inherit;background:var(--superficie);padding:.55rem .6rem;border:1px solid var(--borda-campo);border-radius:.4rem;min-height:6rem}
fieldset{border:1px solid var(--borda);border-radius:.5rem;margin:.75rem 0 0;padding:.6rem .75rem;min-width:0}
legend{font-size:.8125rem;color:var(--suave);padding:0 .3rem}
.mover{display:flex;gap:.4rem;margin-top:.5rem}
.mover button,.linha button{width:auto;margin:0;padding:.3rem .7rem;font-weight:400;font-size:.875rem;background:var(--superficie);color:var(--grafite);border:1px solid var(--borda-campo)}
.linha{display:flex;gap:.5rem;align-items:center;margin-top:.75rem}
.linha select{flex:1}
.problemas{background:var(--atencao-fundo);border-radius:.5rem;padding:.6rem .75rem .6rem 1.75rem;margin:.75rem 0;font-size:.9375rem;list-style:disc}
.problemas li{background:none;border:0;padding:0;margin:0 0 .25rem}
.bloqueia{color:var(--erro)}
.oculto{position:absolute;left:-200vw}
.secundario{background:var(--superficie);color:var(--cota);border:1px solid var(--cota)}
.marcar{display:flex;gap:.5rem;align-items:center}
.marcar input{width:auto}
.atalhos{display:flex;flex-wrap:wrap;gap:.75rem;margin:.5rem 0;font-size:.9375rem}
.atalhos a{color:var(--cota)}
button{width:100%;min-height:44px;margin-top:.75rem;font:inherit;font-weight:600;padding:.7rem;cursor:pointer;border:0;border-radius:.4rem;background:var(--cota);color:var(--sobre-cota)}
button:hover{background:var(--cota-forte)}
.secundario:hover,form.discreto button:hover,.mover button:hover,.linha button:hover{background:var(--papel)}
</style>
</head>
