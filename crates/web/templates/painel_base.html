<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block titulo %}{% endblock %} | CMS Ávila Ops</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;color:#1c1c1c;background:#f6f5f2}
main{max-width:32rem;margin:0 auto;padding:1rem}
h1{font-size:1.25rem;margin:0}
h2{font-size:1rem;margin:1rem 0 .5rem}
p{margin:.25rem 0}
.quem{color:#555;font-size:.875rem}
.recado{padding:.6rem .75rem;border-radius:.5rem;margin:.75rem 0;font-size:.9375rem}
.erro{background:#fde8e6;color:#8a1c12}
.aviso{background:#e5f3e8;color:#17502a}
ul{list-style:none;margin:0;padding:0}
li{background:#fff;border:1px solid #dedbd3;border-radius:.5rem;padding:.6rem .75rem;margin-bottom:.5rem}
li strong{display:block}
li a{color:#1a4fa0;word-break:break-all}
.etiquetas{color:#555;font-size:.8125rem}
form{background:#fff;border:1px solid #dedbd3;border-radius:.5rem;padding:.75rem}
label{display:block;font-size:.875rem;margin-top:.5rem}
label:first-child{margin-top:0}
input{width:100%;font:inherit;padding:.55rem .6rem;border:1px solid #b9b5aa;border-radius:.4rem}
.dica{color:#555;font-size:.8125rem}
select{width:100%;font:inherit;padding:.55rem .6rem;border:1px solid #b9b5aa;border-radius:.4rem;background:#fff}
.voltar{display:inline-block;margin-bottom:.5rem;color:#1a4fa0;font-size:.875rem}
.acao{float:right;font-size:.875rem;margin-left:.75rem}
.midia{display:flex;gap:.6rem;align-items:flex-start}
.midia img{border-radius:.3rem;object-fit:cover;background:#eee}
.midia code{display:block;word-break:break-all}
form.discreto{border:0;padding:0;background:none}
form.discreto button{width:auto;margin-top:.3rem;padding:.25rem .6rem;font-weight:400;font-size:.8125rem;background:#fff;color:#8a1c12;border:1px solid #d9b3ae}
input[type=file]{padding:.4rem}
textarea{width:100%;font:inherit;padding:.55rem .6rem;border:1px solid #b9b5aa;border-radius:.4rem;min-height:6rem}
fieldset{border:1px solid #dedbd3;border-radius:.5rem;margin:.75rem 0 0;padding:.6rem .75rem;min-width:0}
legend{font-size:.8125rem;color:#555;padding:0 .3rem}
.mover{display:flex;gap:.4rem;margin-top:.5rem}
.mover button,.linha button{width:auto;margin:0;padding:.3rem .7rem;font-weight:400;font-size:.875rem;background:#fff;color:#1c1c1c;border:1px solid #b9b5aa}
.linha{display:flex;gap:.5rem;align-items:center;margin-top:.75rem}
.linha select{flex:1}
.problemas{background:#fff7e0;border-radius:.5rem;padding:.6rem .75rem .6rem 1.75rem;margin:.75rem 0;font-size:.9375rem;list-style:disc}
.problemas li{background:none;border:0;padding:0;margin:0 0 .25rem}
.bloqueia{color:#8a1c12}
.oculto{position:absolute;left:-200vw}
.secundario{background:#fff;color:#1a4fa0;border:1px solid #1a4fa0}
.marcar{display:flex;gap:.5rem;align-items:center}
.marcar input{width:auto}
.atalhos{display:flex;flex-wrap:wrap;gap:.75rem;margin:.5rem 0;font-size:.9375rem}
.atalhos a{color:#1a4fa0}
button{width:100%;margin-top:.75rem;font:inherit;font-weight:600;padding:.7rem;border:0;border-radius:.4rem;background:#1a4fa0;color:#fff}
</style>
</head>
<body>
<main>
{% block conteudo %}{% endblock %}
</main>
</body>
</html>
