name: Validar SwiftUI AAD

on:
  pull_request:
    paths:
      - "platforms/ios/**"
      - ".github/workflows/validar-swiftui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build Swift package for iOS Simulator
        working-directory: platforms/ios
        run: xcodebuild -scheme AvilaAADRuntime -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      - name: Test authenticated runtime API client
        working-directory: platforms/ios
        run: swift test --filter AADRuntimeAPIClientTests
      - name: Test Swift package and render native screenshots
        working-directory: platforms/ios
        env:
          AAD_SCREENSHOT_OUTPUT: ${{ github.workspace }}/artifacts/swiftui-runtime
        run: swift test
      - name: Upload native SwiftUI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-runtime-screenshots
          path: artifacts/swiftui-runtime/*.png
          retention-days: 14
          if-no-files-found: error
