name: Validar Android AAD
on:
  pull_request:
    paths:
      - 'platforms/android/**'
      - '.github/workflows/validar-android-aad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aad:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision Android SDK packages
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test Kotlin AAD runtime
        working-directory: platforms/android
        run: gradle :runtime:testDebugUnitTest :runtime:assembleDebug --no-daemon
