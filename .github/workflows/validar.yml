name: Validar
on:
  push:
    branches: [main]
  pull_request:
  # O merge automático chama a validação da main à mão: merge feito com o token
  # do workflow não gera o evento `push` (regra do GitHub).
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      # A imagem de produção do Postgres. Cada teste de integração cria a
      # própria base nela. Vem do espelho oficial no ECR público: o Docker
      # Hub limita pull sem login pelo IP, que os runners dividem.
      postgres:
        image: public.ecr.aws/docker/library/postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      # As consultas são conferidas contra o `.sqlx` versionado, e não contra
      # o banco do serviço, que começa vazio.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Testes
        env:
          CMS_CARDAPIO_PREVIEW: target/cardapio-preview
        run: cargo test --workspace --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seleção de itens
        run: node --test crates/web/recursos/pedido.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cardapio-preview
          path: target/cardapio-preview
          retention-days: 7

  # A imagem de produção. Sai daqui, e não de um servidor da casa: o build em
  # release pede uns 4 GB de disco, e a máquina de build é compartilhada com
  # serviços que não podem ficar sem espaço. `scripts/publicar.sh` baixa o
  # artefato e o carrega no servidor de aplicações.
  imagem:
    needs: validar
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/avilaops/cms.avilaops.com:sha-${{ github.sha }}
          outputs: type=docker,dest=/tmp/imagem.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compactar
        run: gzip -1 /tmp/imagem.tar
      - uses: actions/upload-artifact@v4
        with:
          name: imagem
          path: /tmp/imagem.tar.gz
          retention-days: 7
          compression-level: 0
