name: Validar
on:
  push:
    branches: [main]
  pull_request:
  # O merge automático chama a validação da main à mão: merge feito com o token
  # do workflow não gera o evento `push` (regra do GitHub).
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  langfuse-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo metadata --format-version 1 > /dev/null && cargo fmt --all
      - uses: actions/upload-artifact@v4
        with:
          name: langfuse-rust-metadata
          path: |
            Cargo.lock
            crates/web/src/langfuse.rs
            crates/web/src/lib.rs
            crates/web/src/conector.rs
            crates/servidor/src/main.rs
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # As consultas são conferidas contra o `.sqlx` versionado, e não contra
      # o banco do serviço, que começa vazio.
      SQLX_OFFLINE: "true"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v4
      # Instala no runner para não depender de limites de pull do Docker Hub
      # ou do ECR público. Os builds continuam integralmente no GitHub.
      - name: PostgreSQL 18
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-18
          if sudo pg_lsclusters --no-header | awk '$1 == "18" && $2 == "main" { found=1 } END { exit !found }'; then
            sudo pg_ctlcluster 18 main status >/dev/null || sudo pg_ctlcluster 18 main start
          else
            sudo pg_createcluster 18 main --port 5433 --start
          fi
          sudo pg_conftool 18 main set port 5433
          sudo pg_ctlcluster 18 main restart
          sudo -u postgres psql --set ON_ERROR_STOP=1 \
            --port 5433 \
            --command "alter user postgres password 'postgres'"
          pg_isready --host 127.0.0.1 --port 5433 --username postgres
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Testes
        env:
          CMS_CARDAPIO_PREVIEW: ${{ github.workspace }}/target/cardapio-preview
          CMS_APP_BUILDER_SCREENSHOTS: ${{ github.workspace }}/target/app-builder-capture
        run: cargo test --workspace --locked
      - name: Prints do App Builder
        run: |
          mkdir -p target/app-builder-capture/recursos target/app-builder-screenshots
          cp crates/web/recursos/app-builder.js target/app-builder-capture/recursos/app-builder.js
          python3 -m http.server 4173 --directory target/app-builder-capture >/tmp/app-builder-http.log 2>&1 &
          servidor=$!
          trap 'kill "$servidor"' EXIT
          for tentativa in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/editor.html >/dev/null && break
            sleep 0.25
          done
          google-chrome --headless --no-sandbox --disable-gpu \
            --window-size=1440,1200 --hide-scrollbars \
            --screenshot=target/app-builder-screenshots/editor.png \
            http://127.0.0.1:4173/editor.html
          google-chrome --headless --no-sandbox --disable-gpu \
            --window-size=720,1000 --hide-scrollbars \
            --screenshot=target/app-builder-screenshots/apps.png \
            http://127.0.0.1:4173/apps.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seleção de itens
        run: node --test crates/web/recursos/pedido.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cardapio-preview
          path: target/cardapio-preview
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-builder-screenshots
          path: target/app-builder-screenshots
          retention-days: 14
          if-no-files-found: error

  # A imagem de produção. Sai daqui, e não de um servidor da casa: o build em
  # release pede uns 4 GB de disco, e a máquina de build é compartilhada com
  # serviços que não podem ficar sem espaço. `scripts/publicar.sh` baixa o
  # artefato e o carrega no servidor de aplicações.
  imagem:
    needs: validar
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/avilaops/cms.avilaops.com:sha-${{ github.sha }}
          outputs: type=docker,dest=/tmp/imagem.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compactar
        run: gzip -1 /tmp/imagem.tar
      - uses: actions/upload-artifact@v4
        with:
          name: imagem
          path: /tmp/imagem.tar.gz
          retention-days: 7
          compression-level: 0
