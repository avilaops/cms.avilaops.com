[workspace]
resolver = "3"
members = [
    "crates/dominio",
    "crates/dados",
    "crates/integracoes",
    "crates/web",
    "crates/servidor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
cms-dominio = { path = "crates/dominio" }
cms-dados = { path = "crates/dados" }
cms-integracoes = { path = "crates/integracoes" }
cms-web = { path = "crates/web" }

# Fixado por commit: mudou o motor, este `rev` é atualizado de propósito.
motor-web = { git = "https://github.com/avilaops/motor-web", rev = "0a9671924f105e7a58492ce01c19c0fe04dcf437" }

askama = "0.16"
axum = "0.8"
base64 = "0.22"
# Sem OpenSSL na imagem: TLS pelo rustls.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
# Token e chave ficam no banco só como SHA-256.
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
# Comparação de segredo em tempo constante.
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }

# O codificador AVIF sem otimização leva minutos por imagem.
[profile.dev.package."*"]
opt-level = 2
